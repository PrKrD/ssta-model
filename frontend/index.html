<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSTA Model · SST anomalies</title>
  </head>
  <body>
    <main id="app">
      <div id="globe" aria-label="Interactive numerical field globe"></div>
      <aside class="panel" aria-label="Field information and color controls">
        <p id="badge" class="badge">LOADING DATASET</p>
        <h1 id="dataset-name">SST anomaly model</h1>
        <label id="comparison-control" class="control" hidden>Dataset
          <select id="comparison-layer" aria-label="Comparison dataset">
            <option value="model">Model SSTA</option>
            <option value="era5">ERA5 SSTA</option>
            <option value="difference">Difference — Model − ERA5</option>
            <option value="depth">Mixed-layer depth H</option>
          </select>
        </label>
        <p id="description"></p>
        <p class="help">Drag to rotate · scroll to zoom · hover or tap a cell</p>
        <section id="damping" aria-label="Interactive damping experiment"></section>
        <section id="playback" aria-label="Playback controls"></section>
        <section id="controls" aria-label="Color controls"></section>
        <section id="legend" aria-label="Field legend" aria-live="polite"></section>
        <p id="status" role="status">Preparing globe…</p>
      </aside>
      <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
