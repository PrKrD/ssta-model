<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSTA Model · Field viewer</title>
  </head>
  <body>
    <main id="app">
      <div id="globe" aria-label="Interactive numerical field globe"></div>
      <aside class="panel" aria-label="Field information and color controls">
        <p id="badge" class="badge">LOADING DATASET</p>
        <h1 id="dataset-name">Global field viewer</h1>
        <nav><a href="?dataset=pilot">Model pilot</a> · <a href="?dataset=demo">Synthetic demo</a></nav>
        <p id="description"></p>
        <p class="help">Drag to rotate · scroll to zoom · hover or tap a cell</p>
        <section id="playback" aria-label="Playback controls"></section>
        <section id="controls" aria-label="Color controls"></section>
        <section id="legend" aria-label="Field legend" aria-live="polite"></section>
        <p id="status" role="status">Preparing globe…</p>
      </aside>
      <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
