[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "ssta-model"
version = "0.1.0"
description = "Hybrid statistical-dynamical modelling of global sea surface temperature anomalies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2",
    "xarray>=2024.10",
    "netCDF4>=1.6.5,<2",
]

[project.optional-dependencies]
visualization = ["matplotlib>=3.8,<4"]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<0.15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ssta_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
