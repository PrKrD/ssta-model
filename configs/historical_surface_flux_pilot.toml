[experiment]
name = "historical_surface_flux_pilot"
start_month = "1979-01"
end_month = "1980-12"

[physics]
surface_forcing = true
surface_damping = true

[parameters]
rho_kg_m3 = 1025.0
cp_j_kg_k = 3990.0

[initial_conditions]
temperature_anomaly_k = 0.0

[surface_damping]
configuration = "configs/surface_damping.toml"
# Optional sensitivity override (W m-2 K-1), finite and nonnegative:
# gamma_w_m2_k = 10.0

[inputs]
directory = "data/processed"

[output]
directory = "runs/historical_surface_flux_pilot"
