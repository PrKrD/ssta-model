[experiment]
name = "historical_surface_flux_era5_initialised"
start_month = "1979-01"
end_month = "2026-10"

[physics]
surface_forcing = true
surface_damping = true

[parameters]
rho_kg_m3 = 1025.0
cp_j_kg_k = 3990.0

[initial_conditions]
kind = "era5"
month = "1979-01"
directory = "data/processed"
# Retained scalar option; unused when kind="era5".
temperature_anomaly_k = 0.0

[surface_damping]
configuration = "configs/surface_damping.toml"

[inputs]
directory = "data/processed"

[output]
directory = "runs/historical_surface_flux_era5_initialised"
