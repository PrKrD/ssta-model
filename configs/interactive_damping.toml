[experiment]
name = "interactive_damping"
start_month = "1979-01"
end_month = "1980-12"

[physics]
surface_forcing = true
surface_damping = true
horizontal_diffusion = true

[parameters]
rho_kg_m3 = 1025.0
cp_j_kg_k = 3990.0
kappa_m2_s = 1000.0

[initial_conditions]
kind = "era5"
month = "1979-01"
directory = "data/processed"
temperature_anomaly_k = 0.0

[surface_damping]
configuration = "configs/surface_damping.toml"
gamma_w_m2_k = 16.072239642825945

[inputs]
directory = "data/processed"

[solver]
rtol = 1e-12
maxiter = 500
relative_limit = 1e-10
budget_limit = 1e-6

[mixed_layer_depth]
variant = "era5_bilinear"

[output]
directory = "runs/interactive_damping/REQUEST/model"
